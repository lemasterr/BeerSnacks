<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Beer&amp;Snacks — пиво и снеки в Таллинне</title>
  <meta name="description" content="Beer&amp;Snacks — магазин пива, сидра и снеков в Таллинне: Õismäe tee 1a и Mahtra tn 1. Каталог с ценами и наличием, доставка Wolt и Bolt Food." />
  <meta name="theme-color" content="#17251d" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Beer&amp;Snacks — пиво и снеки в Таллинне" />
  <meta property="og:description" content="Каталог с ценами и наличием в двух магазинах в Таллинне." />
  <meta property="og:url" content="https://beersnacks.pages.dev/" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=20261112d" />
  <link rel="preload" href="/api/site" as="fetch" crossorigin />
  <script>
    // Apply saved theme before first paint (no flash).
    (function () {
      var t = localStorage.getItem('bs_theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      if (!sessionStorage.getItem('bs_lang_ok')) document.documentElement.classList.add('gate-open');
    })();
  </script>
</head>
<body>
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" hidden>
    <div class="gate__inner">
      <div class="logo logo--gate">Beer<span>&amp;</span>Snacks</div>
      <h1 class="gate__title" id="gate-title">
        <span lang="et">Vali keel</span><span lang="en">Choose language</span><span lang="uk">Оберіть мову</span><span lang="ru">Выберите язык</span>
      </h1>
      <div class="gate__langs">
        <button type="button" data-lang="et"><b>Eesti</b><small>Õlu ja snäkid Tallinnas</small></button>
        <button type="button" data-lang="en"><b>English</b><small>Beer and snacks in Tallinn</small></button>
        <button type="button" data-lang="uk"><b>Українська</b><small>Пиво та снеки у Таллінні</small></button>
        <button type="button" data-lang="ru"><b>Русский</b><small>Пиво и снеки в Таллинне</small></button>
      </div>
    </div>
  </div>
  <a class="skip" href="#products">Skip to products</a>

  <header class="top">
    <div class="top__inner wrap">
      <a class="logo" href="./" aria-label="Beer&amp;Snacks">Beer<span>&amp;</span>Snacks</a>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="search" type="search" autocomplete="off" enterkeyhint="search" />
        <button class="search__clear" id="search-clear" type="button" hidden aria-label="Clear">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </label>

      <div class="top__tools">
        <button class="icon-btn" id="theme-toggle" type="button">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
        </button>
        <div class="lang" id="lang">
          <button class="lang__btn" id="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false">RU</button>
          <ul class="lang__menu" id="lang-menu" role="listbox"></ul>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="intro wrap" aria-labelledby="intro-title">
      <div class="intro__text">
        <h1 id="intro-title" class="intro__title"></h1>
        <p class="intro__status" id="open-status"></p>
      </div>
      <div class="intro__actions" id="delivery"></div>
    </section>

    <nav class="cats wrap" aria-label="Categories">
      <div class="cats__list" id="cats" role="tablist"></div>
      <div class="subs" id="subs"></div>
    </nav>

    <section class="wrap" aria-live="polite">
      <p class="result-note" id="result-note" hidden></p>
      <div class="grid" id="products">
        <div class="grid__loading"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap foot__inner">
      <div class="foot__brand">
        <div class="logo logo--big">Beer<span>&amp;</span>Snacks</div>
        <p id="foot-about"></p>
      </div>
      <div class="foot__stores" id="foot-stores"></div>
      <div class="foot__contact">
        <h2 id="foot-contact-title"></h2>
        <p id="foot-hours"></p>
        <p><a id="foot-email" href="mailto:beermix.ee@gmail.com">beermix.ee@gmail.com</a></p>
        <p id="foot-phone" hidden></p>
        <div class="socials" id="socials"></div>
      </div>
    </div>
    <div class="wrap foot__legal">
      <span id="foot-rights"></span>
      <span id="foot-age"></span>
    </div>
  </footer>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet__body" id="sheet-body"></div>
    <button class="sheet__close icon-btn" id="sheet-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
    </button>
  </dialog>

  <button class="to-top icon-btn" id="to-top" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg>
  </button>

  <noscript><p class="wrap">Beer&amp;Snacks — Õismäe tee 1a, Mahtra tn 1, Tallinn. Please enable JavaScript to see the catalog.</p></noscript>
  <script src="js/app.js?v=20261112d" defer></script>
</body>
</html>
